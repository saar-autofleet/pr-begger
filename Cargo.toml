[package]
name = "pr-begger"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Triage code-review requests by kind (rubber-stamp / AI / design) from a pixel-art TUI"
publish = false
repository = "https://github.com/saar-autofleet/pr-begger"
readme = "README.md"

[[bin]]
name = "pr-begger"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4", features = ["derive"] }
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
unicode-width = "0.2"
ureq = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
